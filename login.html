<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIT Vellore - VTOP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js" defer></script>
    <script src="js/firebase-config.js" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/page-init.js" defer></script>
    <script src="js/login-page.js" defer></script>
</head>
<body class="login-body vtop-exact-body">

    <!-- VTOP Header Bar -->
    <header class="vtop-exact-header">
        <div class="vtop-header-container">
            <div class="vtop-brand-group">
                <img class="vtop-logo" src="https://vtop.vit.ac.in/vtop/assets/img/VITLogoEmblem.png" alt="VIT emblem" style="width:32px; height:32px; object-fit:contain;" onerror="this.style.display='none'; document.getElementById('fallback-seal').style.display='flex';">
                <div id="fallback-seal" class="vtop-seal-icon" style="display:none;">
                    <i class="fas fa-university"></i>
                </div>
                <span class="vtop-vit-wordmark">VIT</span>
                <span class="vtop-campus-text">(Vellore Campus)</span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="vtop-exact-main">
        <div class="vtop-card-container">
            <div class="vtop-login-card">
                <!-- Header -->
                <div class="vtop-card-header">
                    <h2>VTOP Login</h2>
                </div>

                <!-- Body -->
                <div class="vtop-card-body">
                    <div id="login-error" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

                    <form id="login-form" onsubmit="event.preventDefault(); loginUser();">
                        <!-- Username / Email -->
                        <div class="mb-3">
                            <div class="vtop-input-group">
                                <input type="email" 
                                       class="form-control vtop-input" 
                                       id="login-email" 
                                       placeholder="Username" 
                                       required 
                                       autocomplete="username">
                                <span class="vtop-input-addon user-addon">
                                    <i class="fas fa-user"></i>
                                </span>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <div class="vtop-input-group">
                                <input type="password" 
                                       class="form-control vtop-input" 
                                       id="login-password" 
                                       placeholder="Password" 
                                       required 
                                       autocomplete="current-password">
                                <button type="button" 
                                        class="vtop-input-addon eye-addon" 
                                        id="password-toggle" 
                                        onclick="togglePasswordVisibility()" 
                                        title="Show/Hide Password">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-flex justify-content-end mt-3 mb-1">
                            <button type="submit" id="login-submit-btn" class="btn vtop-submit-btn">
                                Submit
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Footer Links -->
                <div class="vtop-card-footer">
                    <div class="vtop-footer-links-left">
                        <a href="create-account.html" class="vtop-link">Forgot Password</a>
                        <a href="create-account.html" class="vtop-link">Forgot LoginId</a>
                    </div>
                    <div class="vtop-footer-links-right">
                        <a href="login.html" class="vtop-home-link"><em>Go to Home Page</em></a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- VTOP Bottom Footer -->
    <footer class="vtop-exact-footer">
        Copyright &copy; 2026 Software Development Cell, VIT, Vellore-632 014.
    </footer>

    <div id="app-footer"></div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('login-password');
            const toggleButton = document.getElementById('password-toggle');
            if (!passwordInput || !toggleButton) return;

            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            toggleButton.setAttribute('title', isHidden ? 'Hide password' : 'Show password');
            toggleButton.innerHTML = isHidden
                ? '<i class="fas fa-eye-slash"></i>'
                : '<i class="fas fa-eye"></i>';
        }
    </script>
</body>
</html>

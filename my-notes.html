<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Uploaded Notes - NoteShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/nav.js" defer></script>
</head>
<body class="vtop-exact-body" style="min-height: 100vh; display: flex; flex-direction: column;">
<div id="app-header"></div>

<main class="container-fluid px-3 px-md-4 my-3 flex-grow-1">
    <div class="vtop-page-card">
        <div class="vtop-page-title-bar d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h2 class="mb-0">My Uploaded Notes Repository</h2>
                <p class="text-muted mb-0 small mt-1" style="font-size: 0.82rem;">
                    <i class="fas fa-folder-open text-warning me-1"></i> Manage, edit, or delete notes uploaded by your student account.
                </p>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a href="sell-notes.html" class="btn btn-primary btn-sm px-3 fw-semibold" style="background: #007bff; border-color: #007bff; font-size: 0.82rem;">
                    <i class="fas fa-plus me-1"></i> Upload New Note
                </a>
            </div>
        </div>

        <div class="vtop-page-card-body">
            <div id="my-notes-list">
                <p class="text-muted small">Loading your uploaded notes...</p>
            </div>
        </div>
    </div>
</main>

<script src="js/my-notes.js" defer></script>
<div id="app-footer"></div>
</body>
</html>

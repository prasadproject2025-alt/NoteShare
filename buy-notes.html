<style>
/* Image Gallery Styles */
.image-gallery {
    border-radius: 8px;
    overflow: hidden;
}

.main-image-container {
    transition: transform 0.2s ease;
}

.main-image-container:hover {
    transform: scale(1.02);
}

.thumbnail-strip {
    scrollbar-width: thin;
    scrollbar-color: #dee2e6 transparent;
}

.thumbnail-strip::-webkit-scrollbar {
    height: 4px;
}

.thumbnail-strip::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 2px;
}

.thumbnail-strip::-webkit-scrollbar-thumb {
    background: #dee2e6;
    border-radius: 2px;
}

.thumbnail-strip::-webkit-scrollbar-thumb:hover {
    background: #adb5bd;
}

.thumbnail-img.active {
    box-shadow: 0 0 0 2px #007bff;
}

.zoom-overlay {
    transition: opacity 0.3s ease;
}

.main-image-container:hover .zoom-overlay {
    opacity: 0.9;
}

/* Modal Styles */
.image-modal {
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.modal-nav {
    transition: all 0.2s ease;
}

.modal-nav:hover {
    background: rgba(0,0,0,0.9) !important;
    transform: translateY(-50%) scale(1.1);
}

.modal-close:hover {
    background: rgba(0,0,0,0.9) !important;
    transform: scale(1.1);
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .main-image-container {
        height: 250px;
    }

    .thumbnail-img {
        width: 50px !important;
        height: 50px !important;
    }

    .zoom-overlay, .image-count {
        font-size: 10px !important;
        padding: 3px 8px !important;
    }
}
</style>

document.addEventListener('DOMContentLoaded', function() {

    displayNotes(allNotesCache);

    // Then fetch and merge any database uploaded notes
    if (window.NoteShareBoot && typeof window.NoteShareBoot.waitForApp === 'function') {
        window.NoteShareBoot.waitForApp().then(() => {
            loadAllAvailableNotes();
        }).catch(err => {
            console.log('Firebase ready fallback:', err);
            loadAllAvailableNotes();
        });
    } else {
        setTimeout(loadAllAvailableNotes, 500);
    }
});

function loadCoinBalance() {
    if (window.NoteShareCoins && typeof window.NoteShareCoins.getBalanceInfo === 'function') {
        window.NoteShareCoins.getBalanceInfo().then(data => {
            if (data && data.success) {
                document.getElementById('coin-balance').textContent = (data.coins || 0) + ' Coins';
            }
        }).catch(() => {});
    } else {
        const session = window.NoteShareAuth?.getSession?.();
        document.getElementById('coin-balance').textContent = (session?.user_coins || 0) + ' Coins';
    }
}

function loadAllAvailableNotes() {
    try {
        if (typeof firebase !== 'undefined' && firebase.database) {
            firebase.database().ref('notes').once('value').then(snapshot => {
                const dbNotes = [];
                if (snapshot.exists()) {
                    snapshot.forEach(childSnapshot => {
                        const note = childSnapshot.val();
                        note.id = childSnapshot.key;
                        dbNotes.unshift(note);
                    });
                }
                
                // Merge database notes with default catalog (db notes appear first)
                allNotesCache = [...dbNotes, ...defaultAcademicNotes];
                
                if (selectedNoteId) {
                    const matchingNote = allNotesCache.find(note => note.id === selectedNoteId);
                    if (matchingNote) {
                        displayNotes([matchingNote]);
                        return;
                    }
                }

                displayNotes(allNotesCache);
            }).catch(err => {
                console.warn('DB notes read fallback:', err);
                displayNotes(allNotesCache);
            });
        } else {
            displayNotes(allNotesCache);
        }
    } catch (e) {
        displayNotes(allNotesCache);
    }
}

function searchNotes() {
    const courseCode = document.getElementById('course_code').value.toUpperCase().trim();
    const slot = document.getElementById('slot').value;

    const filtered = allNotesCache.filter(note => {
        const noteCode = (note.course_code || '').toUpperCase();
        const noteName = (note.subject_name || '').toUpperCase();
        const matchesCourse = courseCode === '' || noteCode.includes(courseCode) || noteName.includes(courseCode);
        const matchesSlot = slot === '' || note.slot === slot;
        const isAvailable = !note.status || note.status === 'available';
        return matchesCourse && matchesSlot && isAvailable;
    });

    const notesList = document.getElementById('notes-list');
    if (filtered.length === 0) {
        notesList.innerHTML = '<div class="alert alert-warning py-3"><i class="fas fa-search me-2"></i>No notes found matching your search. Try adjusting the Course Code or Slot filter, or <button class="btn btn-link p-0 fw-semibold" onclick="document.getElementById(\'course_code\').value=\'\'; document.getElementById(\'slot\').value=\'\'; displayNotes(allNotesCache);">view all notes</button>.</div>';
        return;
    }

    displayNotes(filtered);
}

function getTimeAgo(timestamp) {
    if (!timestamp) return 'recently';

    const now = Date.now();
    const diff = now - timestamp;
    const minutes = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);

    if (minutes < 1) return 'just now';
    if (minutes < 60) return `${minutes} minute${minutes > 1 ? 's' : ''} ago`;
    if (hours < 24) return `${hours} hour${hours > 1 ? 's' : ''} ago`;
    return `${days} day${days > 1 ? 's' : ''} ago`;
}

function contactSeller(sellerId, noteId) {
    const currentUserId = (window.NoteShareAuth && typeof window.NoteShareAuth.getUserId === 'function')
        ? window.NoteShareAuth.getUserId()
        : userId;

    fetch('get_user_coins.html?t=' + Date.now(), {
        method: 'GET',
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (!data.success) {
            alert('Error checking coin balance. Please try again.');
            return;
        }

        const coins = data.coins;
        if (coins < 1) {
            alert('You need at least 1 coin to message the seller.');
            return;
        }

        fetch('update_user_coins.html', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                action: 'deduct',
                coins: 1,
                description: 'Message sent to seller for note ' + noteId
            })
        })
        .then(response => response.json())
        .then(updateData => {
            if (!updateData.success) {
                alert('Error deducting coins. Please try again.');
                return;
            }

            firebase.database().ref('notes/' + noteId).once('value').then(noteSnap => {
                const note = noteSnap.val() || {};
                const buyerName = (window.NoteShareAuth && typeof window.NoteShareAuth.getUserName === 'function')
                    ? window.NoteShareAuth.getUserName()
                    : 'Buyer';

                const chatRef = firebase.database().ref('chats').push();
                chatRef.set({
                    buyer_id: currentUserId,
                    seller_id: sellerId,
                    buyer_name: buyerName,
                    seller_name: note.seller_name || 'Seller',
                    note_id: noteId,
                    note_title: note.subject_name || 'Note discussion',
                    note_price: note.price || 0,
                    note_description: note.description || 'Discuss the note content and price here.',
                    subject: note.subject_name || 'Note discussion',
                    created_at: Date.now(),
                    last_message: '',
                    last_message_time: Date.now()
                }).then(() => {
                    window.location.href = 'messages.html?chat_id=' + chatRef.key;
                }).catch(error => {
                    console.error('Error creating chat:', error);
                    alert('Error creating conversation. Please try again.');
                });
            }).catch(error => {
                console.error('Error fetching note details:', error);
                alert('Error creating conversation. Please try again.');
            });
        })
        .catch(error => {
            console.error('Error deducting coins:', error);
            alert('Error deducting coins. Please try again.');
        });
    })
    .catch(error => {
        console.error('Error checking coins:', error);
        alert('Error checking coin balance. Please try again.');
    });
}

// Global variable to store current note images for modal
let currentNoteImages = [];

// Change main image when thumbnail is clicked
function changeMainImage(noteId, imageIndex) {
    const mainImage = document.getElementById(`main-image-${noteId}`);
    const thumbnails = document.querySelectorAll(`[onclick*="changeMainImage('${noteId}'"]`);

    if (!currentNoteImages[noteId] || !currentNoteImages[noteId][imageIndex]) {
        console.error('Image not found for note:', noteId, 'index:', imageIndex);
        return;
    }

    const image = currentNoteImages[noteId][imageIndex];
    mainImage.src = `data:${image.mime_type};base64,${image.base64}`;

    // Update thumbnail active state
    thumbnails.forEach((thumb, index) => {
        if (index === imageIndex) {
            thumb.classList.add('active');
            thumb.style.border = '2px solid #007bff';
        } else {
            thumb.classList.remove('active');
            thumb.style.border = '2px solid #dee2e6';
        }
    });
}

            <div class="modal-content" style="position: relative; max-width: 90%; max-height: 90%;" onclick="event.stopPropagation()">
                <img id="modalImage" src="data:${images[currentImageIndex].mime_type};base64,${images[currentImageIndex].base64}"
                     style="max-width: 100%; max-height: 100%; object-fit: contain;">

                ${images.length > 1 ? `
                    <button class="modal-nav prev" onclick="navigateImage(-1)" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.7); color: white; border: none; padding: 15px; border-radius: 50%; font-size: 18px; cursor: pointer;">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button class="modal-nav next" onclick="navigateImage(1)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.7); color: white; border: none; padding: 15px; border-radius: 50%; font-size: 18px; cursor: pointer;">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                    <div class="image-counter" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: white; padding: 5px 15px; border-radius: 20px; font-size: 14px;">
                        ${currentImageIndex + 1} / ${images.length}
                    </div>
                ` : ''}

                <button class="modal-close" onclick="closeImageModal()" style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: none; padding: 10px; border-radius: 50%; font-size: 16px; cursor: pointer;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    `;

    document.body.insertAdjacentHTML('beforeend', modalHtml);

    // Store current modal state
    window.currentModalImages = images;
    window.currentModalIndex = currentImageIndex;

    // Add keyboard navigation
    document.addEventListener('keydown', handleModalKeydown);
}

function closeImageModal() {
    const modal = document.getElementById('imageModal');
    if (modal) {
        modal.remove();
    }
    document.removeEventListener('keydown', handleModalKeydown);
}

function navigateImage(direction) {
    if (!window.currentModalImages) return;

    window.currentModalIndex += direction;

    if (window.currentModalIndex < 0) {
        window.currentModalIndex = window.currentModalImages.length - 1;
    } else if (window.currentModalIndex >= window.currentModalImages.length) {
        window.currentModalIndex = 0;
    }

    const image = window.currentModalImages[window.currentModalIndex];
    const modalImage = document.getElementById('modalImage');
    modalImage.src = `data:${image.mime_type};base64,${image.base64}`;

    // Update counter
    const counter = document.querySelector('.image-counter');
    if (counter) {
        counter.textContent = `${window.currentModalIndex + 1} / ${window.currentModalImages.length}`;
    }
}

function handleModalKeydown(event) {
    switch(event.key) {
        case 'ArrowLeft':
            navigateImage(-1);
            break;
        case 'ArrowRight':
            navigateImage(1);
            break;
        case 'Escape':
            closeImageModal();
            break;
    }
}

// Store note images globally for modal access
function storeNoteImages(noteId, images) {
    currentNoteImages[noteId] = images;
}
</script>
<div id="app-footer">
</body>
</html>
